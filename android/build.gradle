// android/build.gradle
buildscript {
    ext.kotlin_version = '2.1.0'  // Specify the Kotlin version here

    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        classpath "com.android.tools.build:gradle:8.2.1" // Make sure this is up to date
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:2.1.0"  // Kotlin plugin using the defined version
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

rootProject.buildDir = '../build'
subprojects {
    project.buildDir = "${rootProject.buildDir}/${project.name}"
}
subprojects {
    project.evaluationDependsOn(':app')
}

tasks.register("clean", Delete) {
    delete rootProject.buildDir
}
